name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build MapCreator.sln -c Release -warnaserror

      # Tests that need game files skip without them; a failing test stops the release
      - name: Test
        run: dotnet test --solution MapCreator.sln -c Release --no-build

      - name: Package
        shell: pwsh
        run: |
          Remove-Item Releases\*.pdb, Releases\*.xml -ErrorAction SilentlyContinue
          Compress-Archive -Path Releases\* -DestinationPath "MapCreator-${{ github.ref_name }}.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "MapCreator-${{ github.ref_name }}.zip" `
            --title "MapCreator ${{ github.ref_name }}" `
            --notes "Needs the .NET 10 Desktop Runtime (x64). Unzip anywhere and start MapCreatorNext.exe; the game path is detected from the Eden launcher." `
            --generate-notes
